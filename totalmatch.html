    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
        :root{--void:#070c12;--bg:#070c12;--panel:#0b1018;--raised:#0f1218;--surface:#161b24;--elevated:#1e2533;--hover:#252d3d;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--txt:#f0f2f5;--txt2:#8b949e;--txt3:#3E4A56;--mint:#E8590C;--mint-s:rgba(232,89,12,0.10);--fire:#E8590C;--fire-s:rgba(232,89,12,0.10);--r:5px;--shadow:0 2px 12px rgba(0,0,0,0.5);--t:0.14s cubic-bezier(0.4,0,0.2,1)}
        html,body{margin:0;padding:0;width:100vw;height:100vh;background:var(--void);overflow:hidden;color:var(--txt);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
        #root{width:100%;height:100%} *{box-sizing:border-box} input,select,textarea,button{font-family:inherit}
        *{scrollbar-width:thin;scrollbar-color:rgba(138,151,164,0.25) transparent}
        ::-webkit-scrollbar{width:7px;height:7px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(138,151,164,0.2);border-radius:6px;border:1.5px solid transparent;background-clip:padding-box}
        ::-webkit-scrollbar-thumb:hover{background:rgba(138,151,164,0.4);background-clip:padding-box}
        ::-webkit-scrollbar-corner{background:transparent}
        ::selection{background:rgba(232,89,12,0.25);color:#fff} :focus{outline:none}
        :focus-visible{outline:2px solid rgba(232,89,12,0.7);outline-offset:1px;border-radius:3px}
        button{cursor:pointer;transition:filter var(--t),transform var(--t)}
        button:hover{filter:brightness(1.15)} button:active{filter:brightness(0.9);transform:translateY(0.5px)}
        button:disabled{filter:none;cursor:default;opacity:0.45}
        input[type="range"]{height:16px;overflow:visible;margin:0 4px}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#f0f2f5;border:2px solid currentColor;cursor:pointer;margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,0.4)}
        input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
        input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#f0f2f5;border:2px solid currentColor;cursor:pointer}
        @keyframes pulseRecord{0%{box-shadow:0 0 0 0 rgba(255,23,68,0.7)}70%{box-shadow:0 0 0 6px rgba(255,23,68,0)}100%{box-shadow:0 0 0 0 rgba(255,23,68,0)}}
        .recording-btn{animation:pulseRecord 1.5s infinite!important;background-color:#FF1744!important;color:#fff!important;border-color:#FF1744!important}
        .tab-btn{flex:1;padding:8px 0;text-align:center;font-size:10px;font-weight:600;letter-spacing:0.3px;cursor:pointer;color:var(--txt2);background:var(--panel);border:none;border-bottom:2px solid transparent;transition:color var(--t),background var(--t),border-color var(--t)}
        .tab-btn:hover{color:var(--txt);background:var(--raised)}
        .tab-btn.active{color:#E8590C;border-bottom:2px solid #E8590C;background:rgba(232,89,12,0.08)}
        .ctx-menu{position:fixed;background:var(--raised);border:1px solid var(--border);border-radius:var(--r);overflow:visible;z-index:10002;box-shadow:var(--shadow);min-width:200px;padding:3px 0}
        .ctx-item{padding:8px 16px;font-size:12px;cursor:pointer;color:var(--txt);border-bottom:1px solid rgba(42,52,64,0.35);transition:background var(--t)}
        .ctx-item:last-child{border-bottom:none} .ctx-item:hover{background:var(--hover)}
        .ctx-item.danger{color:#FF1744} .ctx-item.danger:hover{background:rgba(255,23,68,0.12)}
        .ctx-group-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:12px;cursor:pointer;color:var(--txt);border-bottom:1px solid rgba(42,52,64,0.35);user-select:none;transition:background var(--t)}
